<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #FFFFFF;
      display: flex;
      gap: 20px;
      padding: 20px;
    }
    .box {
      border: 1px solid #ccc;
      width: 450px;
      height: 355px;
      position: relative;
    }
    img, svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div>
    <h3>Reference Crop</h3>
    <div class="box">
      <img src="reference/figure_for_trace.png" />
    </div>
  </div>
  <div>
    <h3>Cleaned Vector Trace</h3>
    <div class="box">
      <img src="reference/figure_cleaned.svg" />
    </div>
  </div>
  <div>
    <h3>50% Overlay</h3>
    <div class="box">
      <img src="reference/figure_for_trace.png" />
      <img src="reference/figure_cleaned.svg" style="opacity: 0.65;" />
    </div>
  </div>
</body>
</html>
